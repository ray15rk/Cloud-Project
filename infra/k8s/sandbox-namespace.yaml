apiVersion: v1
kind: Namespace
metadata:
  name: cloudproject-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: cloudproject-sandbox
spec:
  hard:
    count/jobs.batch: "6"
    count/pods: "6"
    count/configmaps: "8"
    requests.cpu: "3"
    requests.memory: 768Mi
    limits.cpu: "3"
    limits.memory: 768Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-sandbox-network
  namespace: cloudproject-sandbox
spec:
  podSelector:
    matchLabels:
      app: cloudproject-sandbox
  policyTypes:
    - Ingress
    - Egress
