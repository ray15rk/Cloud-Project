# NGINX ingress for the pipeline gateway (see docs/nginx-todo.md).
# Start (from anywhere):   nginx -p "<project>/nginx/" -c nginx.conf
# Stop:                    nginx -p "<project>/nginx/" -c nginx.conf -s quit      (same -p and -c as start)
# Relative paths (logs/, temp/) resolve from the -p prefix, so no admin rights are needed.
# The logs/ and temp/ folders must exist (they are kept in git with a .gitkeep file).

worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;

events { worker_connections 1024; }

http {
  server_tokens off;

  # request_time = whole request; upstream_response_time = time spent in the gateway.
  # Free latency data for the evaluation section.
  log_format pipeline '$remote_addr [$time_local] "$request" $status req=$request_time upstream=$upstream_response_time';
  access_log logs/access.log pipeline;

  client_body_temp_path temp/client_body;
  proxy_temp_path       temp/proxy;
  fastcgi_temp_path     temp/fastcgi;
  uwsgi_temp_path       temp/uwsgi;
  scgi_temp_path        temp/scgi;

  # Original TODO values: 20 requests/second per client IP.
  limit_req_zone $binary_remote_addr zone=gateway:10m rate=20r/s;

  server {
    listen 127.0.0.1:8080;          # loopback only; change to "listen 8080;" to accept other machines

    client_max_body_size 256k;      # same cap the gateway enforces
    client_header_timeout 5s;       # cut off stalled clients before they occupy a gateway thread
    client_body_timeout   5s;

    # The ONLY route exposed. "=" is an exact match, so /submit/anything is not proxied.
    location = /submit {
      limit_except POST { deny all; }
      limit_req zone=gateway burst=10 nodelay;   # original TODO values
      limit_req_status 429;                      # not 503: the gateway uses 503 for "capacity"
      proxy_pass http://127.0.0.1:8000;
      proxy_next_upstream off;                   # never re-send a POST (replay / double execution)
      proxy_read_timeout 120s;                   # dry run now, Kubernetes Job later
    }

    # Everything else, including the operator dashboard and its APIs, does not exist from outside.
    location / { return 404; }
  }
}
