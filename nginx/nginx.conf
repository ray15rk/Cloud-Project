# NGINX ingress for the pipeline gateway (see readme.md).
# Start (from anywhere):   nginx -p "<project>/nginx/" -c nginx.conf
# Stop:                    nginx -p "<project>/nginx/" -c nginx.conf -s quit      (same -p and -c as start)
# Relative paths (logs/, temp/) resolve from the -p prefix, so no admin rights are needed.
# The logs/ and temp/ folders must exist (they are kept in git with a .gitkeep file).

worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;

events { worker_connections 1024; }

http {
  server_tokens off;

  # request_time = whole request; upstream_response_time = time spent in the gateway.
  # Free latency data for the evaluation section.
  # Do not log payloads, HMACs, or query strings. Empty upstream = rejected here.
  log_format pipeline escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
    '"method":"$request_method","uri":"$uri","status":$status,'
    '"request_time":$request_time,"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time","upstream_header_time":"$upstream_header_time",'
    '"limit_req":"$limit_req_status","limit_conn":"$limit_conn_status"}';
  access_log logs/access.log pipeline;

  client_body_temp_path temp/client_body;
  proxy_temp_path       temp/proxy;
  fastcgi_temp_path     temp/fastcgi;
  uwsgi_temp_path       temp/uwsgi;
  scgi_temp_path        temp/scgi;

  # Bounded local-demo defaults; rationale and measured results: docs/nginx-evaluation.md.
  limit_req_zone $binary_remote_addr zone=gateway:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=client_connections:10m;
  limit_conn_zone $server_name zone=total_connections:1m;

  server {
    listen 127.0.0.1:8080;          # loopback only; change to "listen 8080;" to accept other machines
    server_name pipeline-gateway;  # nonempty key for the server-wide concurrency counter

    client_max_body_size 256k;      # same cap the gateway enforces
    client_header_timeout 5s;       # cut off stalled clients before they occupy a gateway thread
    client_body_timeout   5s;
    send_timeout 10s;
    keepalive_timeout 10s;
    add_header X-Request-ID $request_id always;

    error_page 413 = @too_large;
    error_page 429 = @overloaded;
    error_page 502 = @unavailable;
    error_page 504 = @timed_out;

  # Submission route. "=" is an exact match, so /submit/anything is not proxied.
    location = /submit {
      limit_except POST { deny all; }
      limit_req zone=gateway burst=10 nodelay;   # original TODO values
      limit_req_status 429;                      # not 503: the gateway uses 503 for "capacity"
      # Match the default eight gateway threads; six-request capacity probe still fits.
      limit_conn total_connections 8;
      limit_conn client_connections 8;
      limit_conn_status 429;
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header X-Request-ID $request_id;
      proxy_next_upstream off;                   # never re-send a POST (replay / double execution)
      proxy_connect_timeout 2s;
      proxy_send_timeout 5s;
      proxy_read_timeout 45s;                    # local pipeline budget; client waits 60s
    }

    location @too_large {
      default_type application/json;
      return 413 '{"delivered":false,"stage":"ingress","reason":"request exceeds 256 KiB","request_id":"$request_id"}';
    }
    location @overloaded {
      default_type application/json;
      add_header X-Request-ID $request_id always;
      add_header Retry-After 1 always;
      return 429 '{"delivered":false,"stage":"ingress","reason":"rate or concurrency limit exceeded","request_id":"$request_id"}';
    }
    location @unavailable {
      default_type application/json;
      return 502 '{"delivered":false,"stage":"ingress","reason":"gateway unavailable","request_id":"$request_id"}';
    }
    location @timed_out {
      default_type application/json;
      return 504 '{"delivered":false,"stage":"ingress","reason":"gateway response timed out; execution outcome unknown","request_id":"$request_id"}';
    }

    # Cloud submissions return 202; allow the sender to poll their final result.
    # The gateway validates the opaque 32-character submission ID.
    location ^~ /submissions/ {
      limit_except GET { deny all; }
      limit_req zone=gateway burst=10 nodelay;
      limit_req_status 429;
      proxy_pass http://127.0.0.1:8000;
      proxy_read_timeout 30s;
    }

    # Everything else, including the operator dashboard and its APIs, does not exist from outside.
    location / { return 404; }
  }
}
